# Approval Workflow
# ================
# When Admiral marks a document as ratified, add their mark here:
# approval_mark: "APPROVED by Carly R. Anderson, 2026-08-21T16:XX:XXZ"
# status: "approved"
#
# Ratification mark format: "APPROVED by [Name], [ISO timestamp], signature/confirmation: [method]"
# Example: "APPROVED by Carly R. Anderson, 2026-08-21T16:30:00Z, via git commit message"

# Verification Policy
# ===================
# Documents in "approved" status are ground truth for this project.
# Documents in "active" status are live but may be pending full ratification.
# Documents in "queued" status require approval before execution.
#
# Every execution of a work-plan (queued status document) requires:
# 1. Validator passes (technical check)
# 2. Admiral approval_mark present (human check)
# 3. This registry updated (audit trail)
