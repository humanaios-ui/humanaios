  notes: 'DISCOVERY ROW. The Act contains its own two-person verification-independence requirement, but scoped to remote biometric
    identification decisions only (with law-enforcement/migration carve-outs). Implications: (1) precedent inside the Act
    for mandated verification independence, which the negative-control Enquiry comment can cite; (2) MATERIAL TO F-CAND-evidence-provenance-recursion-gap:
    the gap claim must be narrowed from ''no independence requirement'' to ''independence required only for one decision class
    (14(5)), never for the evidence-generation channel generally'' — more precise and MORE defensible. Route to the GD-06
    pass brief as a required refinement.'
- id: XW-012
  humanaios_construct: O (Observability) — audit-trail / logging substrate
  target:
    framework: EU AI Act
    element: 'Art 12 record-keeping: automatic event logging over system lifetime; 12(2) traceability purposes (risk identification
      per 79(1), post-market monitoring per 72, operation monitoring per 26(5))'
  relationship: intersects
  match: closeMatch
  verification: clause_verified
  confidence: high
  evidence_maturity: early
  source: Regulation (EU) 2024/1689, OJ version 13 June 2024, concordant OJ-version reproductions read in full, fetched 2026-08-01
  provenance_state: PINNED (OJ citation immutable)
  notes: 'Clause findings: (1) Art 12 is a CAPABILITY requirement (''shall technically allow for the automatic recording'')
    — no requirement that logging be demonstrated to work; the negative-control migration gap''s Art 12 leg is confirmed at
    clause level. (2) 12(2)(b) is the statutory hook wiring logs into Art 72 post-market monitoring — the exact position claimed
    for the gap-function registry (clause-verified support for XW-009''s positioning). (3) DISCOVERY: 12(3)(d) — for biometric
    ID systems, logs must record the identity of the natural persons who performed the 14(5) verification. This is the Act''s
    only oversight-performance-adjacent logging mandate, and it logs WHO oversaw, not whether oversight was effective: presence,
    not performance, at clause precision. Strongest single statutory datum yet for the effectiveness-vs-presence thesis. (4)
    Translation check: Art 12 governs system events; nothing governs fidelity of claims/summaries derived from logs — translation-gap
    Art 12 leg confirmed.'
convergence_computation:
  method: 'consist-style modal agreement: for each HumanAIOS construct, count independent framework columns mapped at closeMatch+;
    convergence score = agreeing frameworks / frameworks assessed. Report with denominators. Frameworks sharing lineage (e.g.,
    prEN drafted to support AI Act) are NOT independent coders — count lineage clusters once, per the GD-06 common-mode caveat.'
  current_note: AI Act and prEN series are one lineage cluster; ISO 42001 partially independent; P(H|F,A) independent (academic).
    Effective independent coder count is ~3, not 5.
acat_calibration_binding:
  humility: match strength capped by verification tier; violations are scoreable overclaim
  consist: convergence = cross-framework modal agreement with lineage-cluster correction
  handoff: rows at asserted/summary_derived route to Z2 before external citation
  provenance: row-level GD-07 states; file-level DATED until ballot texts pin prEN rows
