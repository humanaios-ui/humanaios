# M2 Rank 2: State Migration Manifest
#
# Purpose: Inventory of current state names → proposed unified model mappings
# Used by: Phase 2 (Feature-Branch Harmonization)
# Authority: M2 Rank 2 RFC (M2R2-RFC-2026-07-23-STATE-MACHINE)
#
# Format:
#   repo:
#     entity_type:
#       current_states: [list of state names found in code/DB]
#       proposed_mapping: {current_state: unified_state}
#       compatibility_layer: required? (for backwards compat)

metadata:
  created_at: 2026-07-23
  created_by: empirica-foundation-evaluator (Rank 2 investigation)
  unified_model: "4-tier: planned | in_progress | completed | archived"
  migration_phases: [inventory, harmonization, verification, rollout]
  phase_responsible: "Phase 1 Complete (this document). Phase 2+ ready to begin."
  target_completion: 2026-07-28

repos:
  empirica-autonomy:
    goals:
      current_states: [active, inactive, closed, on-hold]
      proposed_mapping:
        active: in_progress
        inactive: planned
        closed: completed
        on-hold: planned
      conflicts:
        - "on-hold" semantics unclear (planned vs paused?)
        - missing archived tier
      compatibility_layer: required
      priority: p1-critical

    engagements:
      current_states: [active, suspended, completed]
      proposed_mapping:
        active: in_progress
        suspended: planned
        completed: completed
      conflicts:
        - "suspended" suggests temporary pause (no reopen path in current code)
      compatibility_layer: required
      priority: p1-critical

  empirica-outreach:
    proposals:
      current_states: [pending, approved, executed, rejected, withdrawn]
      proposed_mapping:
        pending: planned
        approved: in_progress
        executed: completed
        rejected: archived
        withdrawn: archived
      conflicts:
        - 5-state model reduces to 4-tier (rejection/withdrawal both map to archived)
        - no rollback path from executed
      compatibility_layer: required
      priority: p1-critical

    documents:
      current_states: [draft, published, deprecated, retired]
      proposed_mapping:
        draft: planned
        published: in_progress
        deprecated: completed
        retired: archived
      conflicts:
        - "deprecated" semantics differ from "completed" (still in use vs actually done)
      compatibility_layer: optional (domain-specific, may warrant custom state)
      priority: p2-defer

  empirica-mesh-support:
    decisions:
      current_states: [open, decided, archived, disputed]
      proposed_mapping:
        open: in_progress
        decided: completed
        archived: archived
        disputed: in_progress
      conflicts:
        - "disputed" is intermediate state (no mapping in 4-tier)
        - no "planned" tier for queued decisions
      compatibility_layer: required
      priority: p1-critical

  humanaios:
    collaborations:
      current_states: [draft, ratified, live, end_of_life]
      proposed_mapping:
        draft: planned
        ratified: in_progress
        live: in_progress
        end_of_life: archived
      conflicts:
        - "ratified" is intermediate approval (maps to in_progress not planned)
        - "live" is duplicate of execution state
      compatibility_layer: required
      priority: p2-defer

    projects:
      current_states: [conception, active, paused, complete, archived]
      proposed_mapping:
        conception: planned
        active: in_progress
        paused: in_progress  # with "paused" flag in metadata
        complete: completed
        archived: archived
      conflicts:
        - "paused" is orthogonal to state (should be separate flag)
      compatibility_layer: required
      priority: p1-critical

  empirica-foundation-evaluator:
    goals:
      current_states: [planned, in_progress, completed]  # already partially aligned!
      proposed_mapping:
        planned: planned
        in_progress: in_progress
        completed: completed
      conflicts:
        - missing archived tier (will add)
      compatibility_layer: not_required
      priority: p3-verify

    findings:
      current_states: [logged, promoted, superseded]
      proposed_mapping:
        logged: planned
        promoted: in_progress
        superseded: archived
      conflicts:
        - finding lifecycle differs from goal lifecycle (separate concern)
      compatibility_layer: optional (may remain custom)
      priority: p2-defer

