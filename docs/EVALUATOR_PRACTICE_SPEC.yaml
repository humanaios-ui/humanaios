# NOTES FOR MESH-SUPPORT INTERVIEW (Aug 12-25)

This Practice Specification captures the evaluator seat's governance role: measure epistemic state, audit behavioral calibration, support Admiral decision-making, and oversee practice specification adoption across the foundation.

## Key Interview Topics (Priority Order)

1. **Measurement Independence & F-50 Mitigation (CRITICAL)**
   - How do evaluator's Empirica vector measurements stay independent from ACAT behavioral scores?
   - What are Independence CHECK gates 2A + 2B? How are they verified pre-M2 (2026-09-25)?
   - SER 3.5 is read-only (ACAT → Empirica data flow, no feedback). How is this enforced technically?
   - What if ACAT P1 baseline is delayed? Does it block evaluator's P1 seal?

2. **Phase Gate Coordination (CRITICAL PATH)**
   - M1 (2026-08-08): Both ACAT + Empirica P1 sealed. Prerequisites = autonomy A.0.1-A.0.3 verified + humanaios rater recruitment done. Are these on track?
   - M2 (2026-09-25): Independence CHECK passed. What's the verify protocol?
   - If either prerequisite slips, what's the Admiral escalation protocol?

3. **SER 3.5 Pipeline Integration (INFRASTRUCTURE)**
   - How does ACAT P3 scoring flow to evaluator? (weekly? batch? what latency?)
   - What happens if mesh-support's API endpoint is unavailable during observation window?
   - Convergence analysis requires P3 data to be immutable (sealed to git notes). How is this guaranteed?

4. **Practice Specification Adoption Oversight (GOVERNANCE)**
   - Evaluator provides pre-Admiral governance check on practice specs. Does this add overhead to mesh-support interview process?
   - How much iteration is typical (Phase 1 to Phase 2 feedback)?
   - Admiral ratification (Phase 3): what does evaluator need to brief?

5. **Escalation Paths & Admiral Coordination (DECISION-MAKING)**
   - What types of findings require Admiral briefing vs can be resolved within practices?
   - If independence CHECK fails, what's the escalation? (rebuild measurement? request Admiral decision?)
   - If a practice spec has regulatory gaps, does evaluator flag before or during Admiral review?

## Pre-Interview Preparation

- [ ] SER 1 (.empirica/framework-governance.md) ready for mesh-support review
- [ ] P1 seal checklist finalized (autonomy + humanaios prerequisites, git refs writable, Admiral approval process)
- [ ] SER 3.5 pipeline diagram ready (ACAT → Empirica data flow, read-only constraint)
- [ ] Independence CHECK gates 2A + 2B implementation specs documented
- [ ] Phase gate schedule (M1-M5) confirmed with mesh-support (any timeline conflicts?)
- [ ] Escalation protocol draft (when to flag autonomy/humanaios/Admiral)

