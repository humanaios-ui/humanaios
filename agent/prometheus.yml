# Prometheus Configuration for Phase 3.4
# Scrapes task service metrics and evaluates alerting rules

global:
  scrape_interval: 15s        # Scrape targets every 15 seconds
  evaluation_interval: 15s    # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'empirica-foundation'
    service: 'task-service'
    phase: '3.4'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Rule files to load
rule_files:
  - '/etc/prometheus/alerting_rules.yaml'

scrape_configs:
  # Task Service Metrics (Flask app on localhost:5000)
  - job_name: 'task-service'
    static_configs:
      - targets: ['task-service:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: __scheme__
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'python_.*'
        action: drop  # Drop Python runtime metrics (too verbose)

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 10s

  # OpenTelemetry Collector Metrics (Prometheus exporter on :8889)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s
    scrape_timeout: 5s

  # AlertManager Metrics (if running)
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 15s
