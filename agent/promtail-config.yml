# Promtail Configuration for Phase 3.5.2
# Ships docker container logs to Loki with robust relabeling and error handling

server:
  http_listen_port: 9080
  log_level: info
  grpc_listen_port: 0

# Positions file tracks log read progress (survives restarts)
positions:
  filename: /tmp/positions.yaml
  sync_period: 10s

# Clients define where logs are pushed (Loki)
clients:
  - url: http://loki:3100/loki/api/v1/push
    external_labels:
      host: empirica-foundation-evaluator
      component: promtail
    backoff_config:
      min_period: 100ms
      max_period: 10s
      max_retries: 10

# Scrape configs define what logs to collect
scrape_configs:
  # Docker container logs via Docker socket
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Add container name as label
      - source_labels: ['__meta_docker_container_name']
        target_label: container

      # Add container image name as service label
      - source_labels: ['__meta_docker_container_image_name']
        target_label: service

      # Extract service type from image (e.g., "task-service" from "task-service:latest")
      - source_labels: ['service']
        regex: '([^:]+):?.*'
        target_label: service
        replacement: '$1'

      # Add container ID for debugging
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id

      # Map log stream (stdout/stderr) as label
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      # Skip logs from Promtail and Loki containers to avoid recursion
      - source_labels: ['__meta_docker_container_name']
        regex: '(promtail|loki)-.*'
        action: drop

      # Label for log level detection (enhanced)
      - source_labels: ['stream']
        regex: 'stderr'
        target_label: level
        replacement: 'error'
      - source_labels: ['stream']
        regex: 'stdout'
        target_label: level
        replacement: 'info'

    # Pipeline stages for log processing
    pipeline_stages:
      # Parse multiline logs (timestamps at line start)
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
