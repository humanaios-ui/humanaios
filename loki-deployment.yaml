# Loki Deployment Configuration — Phase 3.5.2 Task 2
# Runs on Phase 3.4 observability stack (Kubernetes or Docker)

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki-config.yaml: |
    auth_enabled: false
    ingester:
      chunk_idle_period: 3m
      max_chunk_age: 1h
      max_streams_per_user: 10000
      chunk_retain_period: 1m
    
    limits_config:
      retention_period: 30d
      max_entries_limit_per_batch: 100000
      ingestion_rate_mb: 64
      ingestion_burst_size_mb: 128
    
    schema_config:
      configs:
      - from: 2024-08-01
        store: boltdb-shipper
        object_store: s3
        schema: v11
        index:
          prefix: loki_index_
          period: 24h
    
    server:
      http_listen_port: 3100
      log_level: info
    
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        shared_store: s3
        cache_location: /loki/boltdb-shipper-cache
      
      s3:
        s3: s3://observability-logs-bucket/loki
        endpoint: s3.us-west-2.amazonaws.com
        region: us-west-2
        insecure: false
    
    chunk_store_config:
      max_look_back_period: 0s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    
    positions:
      filename: /tmp/positions.yaml
    
    clients:
    - url: http://loki:3100/loki/api/v1/push
    
    scrape_configs:
    - job_name: empirica-sessions
      static_configs:
      - targets:
        - localhost
        labels:
          job: empirica-sessions
          __path__: /var/log/empirica/*.log
      
      pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            session_id: session_id
            practice: practice
            phase: phase
      
      - labels:
          session_id: session_id
          practice: practice
          phase: phase
    
    - job_name: acat-grounding
      static_configs:
      - targets:
        - localhost
        labels:
          job: acat-convergence
          __path__: /var/log/acat/*.log
      
      pipeline_stages:
      - json:
          expressions:
            practice: practice
            score: phase_score

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.8.0
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: loki-storage
          mountPath: /loki
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      
      - name: promtail
        image: grafana/promtail:2.8.0
        volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail
        - name: empirica-logs
          mountPath: /var/log/empirica
        - name: acat-logs
          mountPath: /var/log/acat
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: promtail-config
        configMap:
          name: promtail-config
      - name: loki-storage
        emptyDir: {}
      - name: empirica-logs
        hostPath:
          path: /var/log/empirica
      - name: acat-logs
        hostPath:
          path: /var/log/acat

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector:
    app: loki
  ports:
  - protocol: TCP
    port: 3100
    targetPort: 3100
  type: ClusterIP
