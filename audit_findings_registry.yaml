    - audit_methods_disabled: "[M5, M6, M7]  # Not applicable to operations repo"
    - severity_thresholds:
        P0: "escalate_immediately"
        P1: "schedule_week1_fix"
        P2: "schedule_week2_fix"
        P3: "queue_backlog"
    - practice_audit_schedule:
