  P0:
    action: "ESCALATE_IMMEDIATELY"
    owner: "empirica-foundation-evaluator (Z2 gate)"
    timeline: "same_day"
    example: "hardcoded secrets detected"

  P1:
    action: "IMPLEMENT_FIX"
    owner: "per_practice (Week 1-2)"
    timeline: "within_week"
    example: "broken workflow scripts, missing schema fields"

  P2:
    action: "SCHEDULE_FIX"
    owner: "per_practice (Week 2-3)"
    timeline: "within_2_weeks"
    example: "duplicate files, missing anchors"

  P3:
    action: "QUEUE_IMPROVEMENT"
    owner: "per_practice (backlog)"
