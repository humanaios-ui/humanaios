name: Divergence Detect
# Phase 2 Deployment: Detect repository divergence between local and Forgejo
# Runs every 30 minutes to catch drift early

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: divergence-detect
  cancel-in-progress: false

jobs:
  detect-divergence:
    name: Detect Repository Divergence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      diverged: ${{ steps.check.outputs.diverged }}
      local_sha: ${{ steps.check.outputs.local_sha }}
      remote_sha: ${{ steps.check.outputs.remote_sha }}
      commit_count: ${{ steps.check.outputs.commit_count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remotes
        run: |
          git config --global user.name "Empirica Divergence Detect"
          git config --global user.email "divergence-detect@empirica-foundation.local"

          echo "=== Fetching all remotes ==="
          git fetch --all --quiet || true

          echo "=== Current branch ==="
          git branch -vv

      - name: Check for divergence
        id: check
        run: |
          # Get latest commits from both local and forgejo
          FORGEJO_REF="refs/remotes/forgejo/main"
          LOCAL_SHA=$(git rev-parse HEAD)
          FORGEJO_SHA=""

          echo "local_sha=${LOCAL_SHA}" >> $GITHUB_OUTPUT

          if ! git show-ref --verify --quiet "$FORGEJO_REF"; then
            echo "ERROR: Could not fetch forgejo/main"
            echo "diverged=unknown" >> $GITHUB_OUTPUT
            echo "remote_sha=" >> $GITHUB_OUTPUT
            echo "commit_count=unavailable" >> $GITHUB_OUTPUT
            exit 0
          fi

          FORGEJO_SHA=$(git rev-parse "${FORGEJO_REF}^{commit}")
          echo "remote_sha=${FORGEJO_SHA}" >> $GITHUB_OUTPUT

          # Check if they differ
          if [ "$LOCAL_SHA" != "$FORGEJO_SHA" ]; then
            # Calculate commit difference
            COMMITS_AHEAD=$(git rev-list --count "${FORGEJO_REF}..HEAD")
            COMMITS_BEHIND=$(git rev-list --count "HEAD..${FORGEJO_REF}")

            echo "diverged=true" >> $GITHUB_OUTPUT
            echo "commit_count=${COMMITS_AHEAD} ahead, ${COMMITS_BEHIND} behind" >> $GITHUB_OUTPUT

            echo "⚠ DIVERGENCE DETECTED:"
            echo "  Local:  ${LOCAL_SHA:0:8}"
            echo "  Forgejo: ${FORGEJO_SHA:0:8}"
            echo "  Commits ahead: $COMMITS_AHEAD"
            echo "  Commits behind: $COMMITS_BEHIND"
          else
            echo "diverged=false" >> $GITHUB_OUTPUT
            echo "commit_count=0" >> $GITHUB_OUTPUT
            echo "✓ No divergence: repositories in sync"
          fi

      - name: Generate divergence report
        if: steps.check.outputs.diverged == 'true'
        run: |
          mkdir -p reports

          cat > reports/divergence-report.md <<EOF
          # Divergence Report

          **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Repository**: humanaios (empirica-foundation.carly.humanaios)
          **Status**: DIVERGED

          ## Summary
          - Local SHA: ${{ steps.check.outputs.local_sha }}
          - Forgejo SHA: ${{ steps.check.outputs.remote_sha }}
          - Divergence: ${{ steps.check.outputs.commit_count }}

          ## Commits (Local HEAD..Forgejo)

          \`\`\`
          $(git log --oneline refs/remotes/forgejo/main..HEAD | head -20)
          \`\`\`

          ## Recommended Action
          - Run mesh-sync-batch workflow to push local changes to Forgejo
          - Or merge Forgejo changes into local if behind

          ---
          *Generated by divergence-detect workflow*
          EOF

          cat reports/divergence-report.md

      - name: Store divergence data
        if: always()
        run: |
          mkdir -p .empirica/divergence-logs

          cat > .empirica/divergence-logs/$(date +%Y%m%d-%H%M%S).json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "practice": "humanaios",
            "local_sha": "${{ steps.check.outputs.local_sha }}",
            "remote_sha": "${{ steps.check.outputs.remote_sha }}",
            "diverged": "${{ steps.check.outputs.diverged }}",
            "commit_data": "${{ steps.check.outputs.commit_count }}"
          }
          EOF

  # Alert on divergence
  alert-on-divergence:
    name: Alert on Divergence
    runs-on: ubuntu-latest
    needs: detect-divergence
    if: needs.detect-divergence.outputs.diverged == 'true'

    steps:
      - name: Prepare alert
        run: |
          echo "🚨 DIVERGENCE DETECTED"
          echo "Repository: humanaios (empirica-foundation.carly.humanaios)"
          echo "Local SHA: ${{ needs.detect-divergence.outputs.local_sha }}"
          echo "Remote SHA: ${{ needs.detect-divergence.outputs.remote_sha }}"
          echo "Status: ${{ needs.detect-divergence.outputs.commit_count }}"
          echo ""
          echo "Action required: Run mesh-sync-batch workflow or manual sync"

      - name: Create issue if severe divergence
        if: contains(needs.detect-divergence.outputs.commit_count, 'ahead')
        run: |
          echo "Divergence detected and persisted for alerting"

  # Periodic cleanup
  cleanup-old-logs:
    name: Cleanup Old Divergence Logs
    runs-on: ubuntu-latest
    needs: detect-divergence
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean logs older than 7 days
        run: |
          if [ -d .empirica/divergence-logs ]; then
            find .empirica/divergence-logs -type f -mtime +7 -delete
            echo "✓ Cleaned old divergence logs"
          fi
