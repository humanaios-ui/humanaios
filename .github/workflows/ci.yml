name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint API
        run: npm run lint
      - name: Build API
        run: npm run build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/humanaios-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint UI
        run: npm run lint
      - name: Test UI
        run: npm run test -- --run
      - name: Build UI
        run: npm run build

  api-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Validate OpenAPI spec
        run: npm run validate
