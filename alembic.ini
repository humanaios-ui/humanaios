# Alembic configuration for M2R2 Supabase migrations
# Generated for Phase 4 schema deployment

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[sqlalchemy]
sqlalchemy.url = postgresql://user:password@localhost/humanaios
# Override in alembic/env.py from environment variables

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current working directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to os.environ['TZ'] before importing datetime.
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# set to 0 to disable, causing the following defaults to be used
# char_truncate_len = 40

# set to log as root logger; to log to root logger
# note that logging can be set up logging or by --loglevel
# sqlalchemy.url location parsing fallback 'env' variable for DB_URL
sqlalchemy.url_placeholder_scheme = postgresql

# Logging configuration
sqlalchemy_echo = false
