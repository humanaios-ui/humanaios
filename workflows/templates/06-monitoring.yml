name: Monitoring - Health & Alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Health check
        run: npm run health:check

      - name: Metrics collection
        run: npm run metrics:collect

      - name: Alert on failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Health check failed - alerting...')
            // Add alert logic (Slack, PagerDuty, etc.)

      - name: Update dashboard
        run: npm run dashboard:update || true
