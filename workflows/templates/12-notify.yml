name: Notifications - Status & Reports
on:
  workflow_run:
    workflows:
      - CI - Test & Lint
      - Security - Scan & Audit
      - Build & Deploy
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Status: ${{ github.event.workflow_run.conclusion }}"

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Workflow failed: ${{ github.event.workflow_run.name }}",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "Workflow: ${{ github.event.workflow_run.name }}\nStatus: Failed"
                }
              }]
            }

      - name: Update status dashboard
        run: |
          echo "Updating dashboard with status..."
          # Add dashboard update logic
