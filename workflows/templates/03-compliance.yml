name: Compliance - Policy & Standards
on:
  pull_request:
  schedule:
    - cron: '0 9 * * MON'

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md required"
            exit 1
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md required"
            exit 1
          fi

      - name: License check
        run: npm run license:check || echo "⚠️ Review license compliance"

      - name: Code style compliance
        run: npm run compliance:check || true

      - name: Comment PR if failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Compliance checks need attention'
            })
