<!DOCTYPE html>
<html>
<head>
  <title>HumanAIOS API - Interactive Explorer</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3.52.0/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin:0; padding:0; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3.52.0/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "api-spec.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        tryItOutEnabled: true,
        layout: "BaseLayout"
      })
      console.log("✅ Swagger UI loaded");
    }
  </script>
</body>
</html>
