---

# RATIFICATION WORKFLOW (Admiral Process)

admiral_workflow:
  review_cadence: "Daily (recommend: morning, before 09:00 UTC)"

  steps:
    1_load_pending: "Load DECISIONS_PENDING.yaml, sort by severity (HIGH first)"
    2_assess: "For each pending entry:"
      - "Read discovery details (which repo, what divergence)"
      - "Check recommended_action"
      - "Verify proposed_decision makes sense"
    3_decide: "For each entry, choose:"
      - "APPROVE: Ratify the proposed decision"
      - "MODIFY: Edit proposed_decision, then ratify"
      - "REJECT: Decline ratification (log reason)"
      - "DEFER: Review later (re-assess in 24h)"
    4_execute: "For APPROVED entries:"
      - "Move entry from DECISIONS_PENDING to GOVERNANCE_RATIFICATIONS_REGISTRY"
      - "Update entry.status: PENDING_REVIEW → RATIFIED"
      - "Commit both files with ratification summary"
    5_apply: "M3R1 mesh-sync-batch.yml picks up RATIFIED decisions next hourly cycle"
    6_verify: "M3R2/R3 verify applied at next daily cycle"

  decision_template:
    pending_id: "PEN-072623-001"
    admiral_decision: "APPROVE | MODIFY | REJECT | DEFER"
    ratified_at: "2026-07-23T09:30:00Z"
    ratified_decision_id: "D-072623-001"  # Assigned by Admiral
    notes: "Approved: repo was offline, resync appropriate"

---

# ESCALATION (Admiral → Cortex)

escalation_rules:
  high_severity_unreviewed: ">2 HIGH entries unreviewed for >24h"
    action: "Alert Admiral (Slack/email)"

  divergence_cascade: ">50% repos in DRIFT state"
    action: "Escalate to mesh-support (cross-org collab)"

  persistent_failure: "Same repo fails >3 consecutive days"
    action: "Investigate (network issue? broken listener?)"

---

# AUTO-EXPIRE POLICY

expiration:
  pending_ttl_days: 7
  rule: "PENDING entries auto-expire if not ratified within 7 days"
  on_expire: "Move to DECISIONS_EXPIRED.yaml (archive), alert Admiral"
  rationale: "Forces decision-making; prevents stale queue"

---

# INTEGRATION CHECKLIST (Auto-Populated by M3R2/R3)

# M3R2 (divergence-detect.yml) writes entries when:
#   - divergence_count >= DIVERGENCE_THRESHOLD
#   - Status = ALERT (not OK, not INIT)

# M3R3 (state-validate.yml) writes entries when:
#   - validation_status = WARNINGS or ERROR
#   - issue_type = VALIDATION_FAILURE, STALE_ACK, or NETWORK_FAILURE

# Admiral reads/ratifies when:
#   - entries exist in pending_ratifications.entries[]
#   - Daily review cycle (recommend 09:00 UTC)

# System applies when:
#   - Entry ratified (status = RATIFIED)
#   - Next M3R1 hourly dispatch cycle
#   - Decision payload created from entry.proposed_decision

# M3R2/R3 verify when:
#   - Next daily cycle (00:00 UTC for M3R2, 12:00 UTC for M3R3)
#   - Check if ratified decisions have been applied
#   - If applied: remove from DECISIONS_PENDING, log to REGISTRY
#   - If not applied: escalate (possible dispatch failure)
