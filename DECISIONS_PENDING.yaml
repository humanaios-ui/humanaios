# Decisions Awaiting Ratification (Feedback Loop Hub)
#
# PURPOSE: Single source of truth for pending ratifications.
# System-discovered issues are logged here. Admiral reviews and ratifies.
# Once ratified, decisions move to GOVERNANCE_RATIFICATIONS_REGISTRY.yaml
#
# WORKFLOW:
#   M3R2/R3 discovers issue → Log PENDING entry
#       ↓
#   Admiral reviews DECISIONS_PENDING.yaml
#       ↓
#   Admiral ratifies (approval)
#       ↓
#   Decision moves to GOVERNANCE_RATIFICATIONS_REGISTRY.yaml
#       ↓
#   M3R1 dispatches approved decision
#       ↓
#   M3R2/R3 verifies applied

metadata:
  registry_version: "1.0"
  created_at: 2026-07-23T18:00:00Z
  updated_at: 2026-07-23T18:00:00Z
  authority: "empirica-foundation Admiral (Carly R. Anderson)"
  purpose: "Master queue for ratifications awaiting Admiral approval"
  canonical_location: "empirica-foundation-evaluator/DECISIONS_PENDING.yaml"

  parent_registry: "GOVERNANCE_RATIFICATIONS_REGISTRY.yaml"
  parent_location: "empirica-foundation-evaluator/GOVERNANCE_RATIFICATIONS_REGISTRY.yaml"
  relationship: "PENDING → (Admiral ratifies) → RATIFIED"

  feedback_loop:
    discovery: "M3R2 divergence-detect.yml + M3R3 state-validate.yml"
    submission: "Workflows write PENDING entries"
    review: "Admiral reads DECISIONS_PENDING.yaml daily"
    ratification: "Admiral approves → entry removed from PENDING, added to REGISTRY"
    application: "M3R1 mesh-sync-batch.yml dispatches ratified decisions"
    verification: "M3R2/R3 verify applied"

  pending_decision_types:
    DIVERGENCE: "Repo out of sync (missing decisions, stale ACKs)"
    VALIDATION_FAILURE: "Decision rejected during validation"
    NETWORK_FAILURE: "Repo unreachable during discovery"
    STATE_MISMATCH: "Applied state differs from expected"
    ACK_TIMEOUT: "ACK not received within tolerance window"
    SIGNATURE_MISMATCH: "Admiral signature verification failed"

